<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MetricsApp — Вход</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
<div class="auth-card">
    <div class="auth-logo">📊 MetricsApp</div>
    <p class="auth-subtitle">Аналитика бизнес-метрик</p>

    <div class="tabs">
        <button class="tab-btn {% if tab != 'register' %}active{% endif %}"
                onclick="showTab('login')">Вход</button>
        <button class="tab-btn {% if tab == 'register' %}active{% endif %}"
                onclick="showTab('register')">Регистрация</button>
    </div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <div id="tab-login" class="tab-content {% if tab == 'register' %}hidden{% endif %}">
        <form method="post" action="/login">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="example@email.com" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Войти</button>
        </form>
    </div>

    <div id="tab-register" class="tab-content {% if tab != 'register' %}hidden{% endif %}">
        <form method="post" action="/register">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="example@email.com" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Минимум 6 символов" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
        </form>
    </div>
</div>

<script>
function showTab(name) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + name).classList.remove('hidden');
    event.target.classList.add('active');
}
</script>
</body>
</html>
